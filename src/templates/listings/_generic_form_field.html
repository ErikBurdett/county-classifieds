<div class="form-field{% if full_width %} generic-form-grid__full{% endif %}{% if field.errors %} has-error{% endif %}"{% if category_field %} data-category-field{% endif %}>
  {{ field.label_tag }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}
  {{ field }}
  {% if field.help_text %}<p class="help-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" id="{{ field.id_for_label }}_error" role="alert">{{ error }}</p>{% endfor %}
</div>
