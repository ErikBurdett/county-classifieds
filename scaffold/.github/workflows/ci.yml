name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5432/marketplace_test

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Django checks
        run: uv run python src/manage.py check

      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-production-check-only
          DJANGO_ALLOWED_HOSTS: market.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://market.example.com
          DATABASE_URL: postgresql://marketplace:marketplace@127.0.0.1:5432/marketplace_test
          DATABASE_SSL_REQUIRE: "false"
          AWS_REGION: us-east-1
          AWS_STORAGE_BUCKET_NAME: ci-placeholder
          EMAIL_HOST: email-smtp.us-east-1.amazonaws.com
          EMAIL_HOST_USER: ci-placeholder
          EMAIL_HOST_PASSWORD: ci-placeholder
          SES_FROM_EMAIL: market@example.com
        run: uv run python src/manage.py check --deploy

      - name: Migration drift
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run pytest --junitxml=junit.xml --cov-report=xml

      - name: Dependency audit
        run: uv run pip-audit

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --tag county-post-marketplace:${{ github.sha }} .
